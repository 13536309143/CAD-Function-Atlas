name: offline-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYVISTA_OFF_SCREEN: 'true'
      LLM_PROVIDER: minimax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python cad_doctor.py --render --out outputs/ci_environment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-${{ matrix.os }}-py${{ matrix.python }}
          path: outputs/ci_environment
